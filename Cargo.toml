[package]
name = "wow-auction-monitor"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.4"
chrono = {version = "0.4", default-features = false, features = ["std"]}
flate2 = "1"
fs4 = "0.6"
tempfile = "3"
subtle = "2"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
